name: Kick YouTube wedding film v20.4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/youtube-wedding-film-v20-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/youtube-wedding-film-v20-4
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Execute reviewed one-off patch and push result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-youtube-wedding-film-v20-4.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in text or end_marker not in text:
              raise SystemExit('FAIL: cannot locate embedded patch script')
          segment = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in segment.splitlines()
          )
          exec(compile(script, str(path), 'exec'))
          PY

          rm -f .github/workflows/apply-youtube-wedding-film-v20-4.yml
          rm -f .github/workflows/kick-youtube-wedding-film-v20-4.yml
          node --check wedding-film.js
          node tests/wedding_film_check.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(video): add lazy YouTube wedding film"
          git push origin HEAD:feature/youtube-wedding-film-v20-4
