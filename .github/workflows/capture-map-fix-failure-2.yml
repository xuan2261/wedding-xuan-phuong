name: Capture second map fix failure

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: github.head_ref == 'fix/event-map-binding-v20-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Capture failed test output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          gh api repos/${GITHUB_REPOSITORY}/actions/jobs/89970301986/logs > /tmp/job.log
          tail -n 180 /tmp/job.log > reports/MAP-FIX-FAILURE-2.txt
          rm -f .github/workflows/capture-map-fix-failure-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ci): capture second map fix failure"
          git push origin HEAD:${{ github.head_ref }}
