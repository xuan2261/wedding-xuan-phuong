name: Check v20 finish script

on:
  push:
    branches: [images/refresh-photoshop-v20]
    paths:
      - tools/finish_image_pack_v20.ps1
      - .github/workflows/check-finish-script-v20.yml
  pull_request:
    branches: [main]
    paths:
      - tools/finish_image_pack_v20.ps1
      - .github/workflows/check-finish-script-v20.yml

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/finish_image_pack_v20.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PASS: finish_image_pack_v20.ps1 parses successfully'
