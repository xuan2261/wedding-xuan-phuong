name: Diagnose AK-debug workflow status 2

on:
  push:
    branches: [audit/ak-debug-v20-2]
    paths:
      - .github/workflows/diagnose-ak-debug-run-2.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/ak-debug-v20-2
          fetch-depth: 0
      - name: Capture recent branch workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=audit%2Fak-debug-v20-2&per_page=30" > reports/AK-DEBUG-WORKFLOW-RUNS-2.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('reports/AK-DEBUG-WORKFLOW-RUNS-2.json').read_text())
          lines=[]
          for run in payload.get('workflow_runs', []):
              lines.append(f"{run['id']}\t{run['name']}\t{run['event']}\t{run['status']}\t{run.get('conclusion')}\t{run['head_sha']}")
          Path('reports/AK-DEBUG-WORKFLOW-RUNS-2.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Commit diagnosis and remove helper
        run: |
          rm -f .github/workflows/diagnose-ak-debug-run-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "debug(ci): refresh AK-debug workflow status"
          git push origin HEAD:audit/ak-debug-v20-2
