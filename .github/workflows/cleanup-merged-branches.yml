name: Cleanup merged branches

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup-closed-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branch if it still exists
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          delete_branch_if_present() {
            local branch="$1"
            local encoded_ref
            local error_file
            local delete_output

            encoded_ref=$(jq -rn --arg value "$branch" '$value|@uri')
            error_file=$(mktemp)

            if ! gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_ref}" \
              >/dev/null 2>"${error_file}"; then
              if grep -Eq 'HTTP 404|Not Found|Reference does not exist' "${error_file}"; then
                echo "SKIP: ${branch} is already absent"
                rm -f "${error_file}"
                return 0
              fi

              cat "${error_file}" >&2
              rm -f "${error_file}"
              return 1
            fi
            rm -f "${error_file}"

            echo "DELETE: merged PR head ${branch}"
            if delete_output=$(gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_ref}" 2>&1); then
              return 0
            fi

            # Một workflow hoặc thiết lập auto-delete có thể xóa branch sau bước
            # kiểm tra tồn tại nhưng trước lệnh DELETE. Trường hợp race này vẫn là
            # trạng thái đích hợp lệ; các lỗi API/quyền khác phải tiếp tục fail.
            if grep -Eq 'HTTP 404|HTTP 422|Not Found|Reference does not exist' \
              <<<"${delete_output}"; then
              echo "SKIP: ${branch} disappeared before DELETE completed"
              return 0
            fi

            echo "${delete_output}" >&2
            return 1
          }

          delete_branch_if_present "$HEAD_REF"

  cleanup-historical-branches:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete merged and approved temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch="${{ github.event.repository.default_branch }}"

          merged_pr_branches=(
            "audit/v19.4-release-readiness"
            "hardening/v19.5-release-gates"
            "chore/dependency-rollup-and-redeploy"
            "ops/pages-live-watch-and-branch-cleanup"
            "ops/recover-image-pack-v20-history"
            "fix/image-pack-recovery-evidence"
          )

          approved_orphan_branches=(
            "staging/v20-binary-upload"
            "images/refresh-photoshop-v20-final"
            "feature/photoshop-images-v20-clean"
          )

          declare -A approved_orphan=()
          for branch in "${approved_orphan_branches[@]}"; do
            approved_orphan["$branch"]=1
          done

          delete_branch_if_present() {
            local branch="$1"
            local encoded_ref
            local delete_output

            encoded_ref=$(jq -rn --arg value "$branch" '$value|@uri')
            echo "DELETE: $branch"
            if delete_output=$(gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_ref}" 2>&1); then
              return 0
            fi

            if grep -Eq 'HTTP 404|HTTP 422|Not Found|Reference does not exist' \
              <<<"${delete_output}"; then
              echo "SKIP: $branch was already removed"
              return 0
            fi

            echo "${delete_output}" >&2
            return 1
          }

          candidates=("${merged_pr_branches[@]}" "${approved_orphan_branches[@]}")

          for branch in "${candidates[@]}"; do
            if [[ "$branch" == "$default_branch" ]]; then
              echo "BLOCKED: refusing to delete default branch $branch"
              continue
            fi

            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "SKIP: $branch does not exist"
              continue
            fi

            open_prs=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$branch" \
              --json number \
              --jq 'length')
            if [[ "$open_prs" != "0" ]]; then
              echo "KEEP: $branch is referenced by $open_prs open pull request(s)"
              continue
            fi

            if [[ -z "${approved_orphan[$branch]+x}" ]]; then
              merged_prs=$(gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --state merged \
                --head "$branch" \
                --json number \
                --jq 'length')
              if [[ "$merged_prs" == "0" ]]; then
                echo "BLOCKED: $branch has no merged pull request evidence"
                continue
              fi
            else
              echo "APPROVED: $branch is an explicitly reviewed temporary orphan"
            fi

            delete_branch_if_present "$branch"
          done

          echo "## Branch cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Protected default branch: \`$default_branch\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing/already-deleted refs are successful no-ops." >> "$GITHUB_STEP_SUMMARY"
          echo "- Open-PR branches are always kept." >> "$GITHUB_STEP_SUMMARY"
          echo "- Merged branches require merged-PR evidence." >> "$GITHUB_STEP_SUMMARY"
          echo "- Temporary orphan deletion is restricted to the reviewed allowlist." >> "$GITHUB_STEP_SUMMARY"
