name: Diagnose visual v20.1 source checks

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-visual-source-v20-1.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/visual-overlap-v20-1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pillow playwright
      - name: Run every static source check and preserve results
        shell: bash
        run: |
          set +e
          mkdir -p reports
          report=reports/VISUAL-SOURCE-DIAGNOSIS-V20.1.log
          : > "$report"
          echo "HEAD=$(git rev-parse HEAD)" >> "$report"
          echo "== JavaScript syntax ==" >> "$report"
          for file in app.js config.js guest-utils.js event-entry.js; do
            echo "--- node --check $file" >> "$report"
            node --check "$file" >> "$report" 2>&1
            echo "status=$?" >> "$report"
          done
          echo "== Python tests ==" >> "$report"
          find tests -maxdepth 1 -type f -name '*.py' -print | sort >> "$report"
          for test in $(find tests -maxdepth 1 -type f -name '*.py' | sort); do
            echo "--- python $test" >> "$report"
            python "$test" >> "$report" 2>&1
            echo "status=$?" >> "$report"
          done
          echo "== Build dist ==" >> "$report"
          python tools/build-dist.py >> "$report" 2>&1
          echo "status=$?" >> "$report"
          echo "== Working tree after build ==" >> "$report"
          git status --short >> "$report"
          cat "$report"
          exit 0
      - name: Commit diagnosis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/VISUAL-SOURCE-DIAGNOSIS-V20.1.log
          git commit -m "debug(ui): record visual source check failures"
          git push origin HEAD:fix/visual-overlap-v20-1
