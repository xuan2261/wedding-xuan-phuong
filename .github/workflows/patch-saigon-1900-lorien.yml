name: Patch Saigon reception data

on:
  push:
    branches:
      - fix/saigon-1900-lorien

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/saigon-1900-lorien
          fetch-depth: 0
      - name: Apply requested Saigon updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = [
              ('2026-08-22T18:30:00+07:00', '2026-08-22T19:00:00+07:00'),
              ('18h30', '19h00'),
              ('Sesan Restaurant', 'Sảnh Lorien, Sesan Restaurant'),
          ]

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          changed = []
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new_text = text
              for old, new in replacements:
                  new_text = new_text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(raw)

          workflow = Path('.github/workflows/patch-saigon-1900-lorien.yml')
          if workflow.exists():
              workflow.unlink()

          print('Updated files:')
          for item in changed:
              print('-', item)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(data): update Saigon reception time and venue"
          git push origin HEAD:fix/saigon-1900-lorien
