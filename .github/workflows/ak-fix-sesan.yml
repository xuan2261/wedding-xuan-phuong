name: AK-FIX Sesan venue data

on:
  push:
    branches:
      - fix/sesan-venue-address

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/sesan-venue-address
          fetch-depth: 0

      - name: Apply minimal Sesan venue patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "config.js": [
                  ('venueName: "Nhà hàng Sesan"', 'venueName: "Sesan Restaurant"'),
                  ('addressLine1: "14 Einstein"', 'addressLine1: "14-15-16 Einstein"'),
              ],
              "tools/wedding-data.json": [
                  ('"venueName": "Nhà hàng Sesan"', '"venueName": "Sesan Restaurant"'),
                  ('"addressLine1": "14 Einstein"', '"addressLine1": "14-15-16 Einstein"'),
                  ('"address": "14 Einstein, Phường Thủ Đức, Thành phố Hồ Chí Minh"', '"address": "14-15-16 Einstein, Phường Thủ Đức, Thành phố Hồ Chí Minh"'),
              ],
              "assets/calendar/bao-hy-sai-gon-2026-08-22.ics": [
                  ('LOCATION:Nhà hàng Sesan\\, 14 Einstein\\,', 'LOCATION:Sesan Restaurant\\, 14-15-16 Einstein\\,'),
              ],
              "tests/event_location_consistency_check.py": [
                  ('require(\'addressLine1: "14 Einstein"\' in CONFIG, "Sesan chưa sửa thành 14 Einstein")',
                   'require(\'venueName: "Sesan Restaurant"\' in CONFIG, "Tên Sesan chưa đồng bộ")\nrequire(\'addressLine1: "14-15-16 Einstein"\' in CONFIG, "Địa chỉ Sesan chưa sửa thành 14-15-16 Einstein")'),
              ],
              "tests/multi_event_check.mjs": [
                  ('const multi = load("#events=bride,groom&event=bride");',
                   'const saiGon = load("#event=saigon");\nassert.equal(saiGon.event.venueName, "Sesan Restaurant");\nassert.equal(saiGon.event.addressLine1, "14-15-16 Einstein");\n\nconst multi = load("#events=bride,groom&event=bride");'),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{file_name}: expected exactly one occurrence of {old!r}, found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Rebuild generated dist
        run: python tools/build-dist.py

      - name: Run focused AK-FIX verification
        shell: bash
        run: |
          python tests/event_location_consistency_check.py
          node tests/multi_event_check.mjs
          python tests/share_entry_pages_check.py
          python tests/verify_dist.py
          if git grep -n -E 'Nhà hàng Sesan|addressLine1: "14 Einstein"|"addressLine1": "14 Einstein"|LOCATION:Nhà hàng Sesan\\, 14 Einstein' -- config.js tools/wedding-data.json assets/calendar dist; then
            echo "Old Sesan venue data remains in production paths"
            exit 1
          fi
          git grep -n -E 'Sesan Restaurant|14-15-16 Einstein' -- config.js tools/wedding-data.json assets/calendar dist tests

      - name: Commit clean patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/ak-fix-sesan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(data): update Sesan venue name and address"
          git push origin HEAD:fix/sesan-venue-address
