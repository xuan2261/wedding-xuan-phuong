name: Recover Photoshop images from public Google Photos

on:
  push:
    branches: [images/refresh-photoshop-v20]
    paths:
      - .image-pack-v20/GOOGLE_PHOTOS_READY
      - tools/recover_google_photos_v20.py
      - tools/run_google_photos_recovery_v20.py
      - .github/workflows/recover-google-photos-v20.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-google-photos-v20
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: images/refresh-photoshop-v20
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image and browser tooling
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          python -m playwright install --with-deps chromium
      - name: Recover exact public album sources and materialize v20
        id: recover
        shell: bash
        run: |
          mkdir -p reports
          set +e
          python tools/run_google_photos_recovery_v20.py \
            --root "${GITHUB_WORKSPACE}" \
            --album-url "https://photos.app.goo.gl/SwCq2r7wzxa3XSy18" \
            > reports/google-photos-v20-recovery.log 2>&1
          status=$?
          cat reports/google-photos-v20-recovery.log
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Preserve diagnostics on failure
        if: steps.recover.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/google-photos-v20-recovery.log reports/GOOGLE-PHOTOS-PAGE.html || true
          git commit -m "debug(images): preserve Google Photos recovery evidence" || true
          git push origin HEAD:images/refresh-photoshop-v20
      - name: Stop after preserving diagnostics
        if: steps.recover.outputs.status != '0'
        run: exit 1
      - name: Verify generated images and source
        run: |
          python tests/verify_assets.py
          python tests/share_entry_pages_check.py
          node --check app.js
          node --check config.js
          node --check guest-utils.js
          python tools/build-dist.py
          python tests/verify_dist.py
      - name: Commit final v20 assets
        shell: bash
        run: |
          rm -f reports/google-photos-v20-recovery.log reports/GOOGLE-PHOTOS-PAGE.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(images): refresh all wedding photos from Photoshop masters"
          git push origin HEAD:images/refresh-photoshop-v20
