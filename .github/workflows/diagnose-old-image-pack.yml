name: Diagnose old image pack chunks

on:
  push:
    branches: [images/refresh-photoshop-v20]
    paths:
      - .image-pack-v20/OLD_DIAGNOSE

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: images/refresh-photoshop-v20
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Diagnose existing staged chunks
        shell: bash
        run: |
          mkdir -p reports
          python - <<'PY' > reports/old-image-pack-diagnosis.json
          import base64, hashlib, json, re
          from pathlib import Path
          root = Path('.image-pack-v20')
          files = sorted(root.glob('part-*.b64'))
          allowed = re.compile(r'^[A-Za-z0-9+/=]*$')
          report = {'files': [], 'combined': {}}
          chunks = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              stripped = ''.join(text.split())
              invalid = sorted(set(ch for ch in stripped if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='))
              item = {
                  'name': path.name,
                  'chars_raw': len(text),
                  'chars_stripped': len(stripped),
                  'mod4': len(stripped) % 4,
                  'invalid_chars': invalid,
                  'sha256_text': hashlib.sha256(stripped.encode()).hexdigest(),
                  'prefix': stripped[:24],
                  'suffix': stripped[-24:],
              }
              try:
                  base64.b64decode(stripped, validate=True)
                  item['individually_valid'] = True
              except Exception as exc:
                  item['individually_valid'] = False
                  item['error'] = f'{type(exc).__name__}: {exc}'
              report['files'].append(item)
              chunks.append(stripped)
          combined = ''.join(chunks)
          report['combined'].update({
              'chars': len(combined),
              'mod4': len(combined) % 4,
              'sha256_text': hashlib.sha256(combined.encode()).hexdigest(),
          })
          try:
              payload = base64.b64decode(combined, validate=True)
              report['combined']['valid'] = True
              report['combined']['bytes'] = len(payload)
              report['combined']['sha256_payload'] = hashlib.sha256(payload).hexdigest()
          except Exception as exc:
              report['combined']['valid'] = False
              report['combined']['error'] = f'{type(exc).__name__}: {exc}'
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY
          cat reports/old-image-pack-diagnosis.json
      - name: Commit diagnosis
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/old-image-pack-diagnosis.json
          git commit -m "debug(images): diagnose old base64 staging chunks"
          git push origin HEAD:images/refresh-photoshop-v20
