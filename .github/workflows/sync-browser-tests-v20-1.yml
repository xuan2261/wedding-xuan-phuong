name: Sync browser tests v20.1

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sync-browser-tests-v20-1.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/visual-overlap-v20-1
          fetch-depth: 0
      - name: Update browser regression build markers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            sed -i 's/v19\.4-20260724/v20.1-20260726/g' "$file"
          done < <(grep -RIl --include='*.js' --include='*.mjs' --include='*.py' 'v19.4-20260724' tests || true)
          rm -f .github/workflows/sync-browser-tests-v20-1.yml
      - name: Commit synchronized tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(browser): validate visual v20.1 build"
          git push origin HEAD:fix/visual-overlap-v20-1
