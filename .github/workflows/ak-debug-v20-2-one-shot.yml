name: AK-debug v20.2 one-shot hardening

on:
  push:
    branches: [audit/ak-debug-v20-2]
    paths:
      - .github/workflows/ak-debug-v20-2-one-shot.yml
      - tools/apply-ak-debug-v20-2.py
      - tests/audio_story_browser_regression.mjs

permissions:
  contents: write

jobs:
  audit-fix-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/ak-debug-v20-2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Apply deterministic root-cause fixes
        run: python tools/apply-ak-debug-v20-2.py
      - name: Preserve connector-managed workflow files
        run: |
          git checkout -- .github/workflows/verify-pages.yml
          git checkout -- .github/workflows/guest-release.yml
      - name: Install complete audit dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow opencv-python-headless
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run full AK-debug regression suite
        shell: bash
        run: |
          set -euo pipefail
          python tests/consistency_check.py
          python tests/build_metadata_check.py
          python tests/verify_release.py
          node tests/multi_event_check.mjs
          node tests/opening_experience_check.mjs
          node tests/audio_story_regression_check.mjs
          node tests/story_asset_preload_check.mjs
          node tests/release_hardening_check.mjs
          python tests/guest_tool_check.py
          python tests/release_readiness_check.py
          python tests/live_pages_verifier_check.py
          node tests/lifecycle_check.js
          node tests/contract_check.js
          node tests/personalization_check.js
          python tests/verify_assets.py
          node --check app.js
          node --check config.js
          node --check guest-utils.js
          node --check event-entry.js
          for file in tools/*.gs; do cp "$file" /tmp/apps-script-check.js; node --check /tmp/apps-script-check.js; done
          python tools/build-dist.py
          python tests/share_entry_pages_check.py
          python tests/verify_dist.py
          npm run test:browser
          npm run test:visual-safe-zones
          npm run test:audio-story-browser
      - name: Commit audited source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply-ak-debug-v20-2.py
          git clean -fdX
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audit): harden v20.2 deploy and visual gates"
          git pull --rebase origin audit/ak-debug-v20-2
          git push origin HEAD:audit/ak-debug-v20-2
