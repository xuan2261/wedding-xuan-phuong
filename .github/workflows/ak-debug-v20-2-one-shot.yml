name: AK-debug v20.2 one-shot hardening

on:
  push:
    branches: [audit/ak-debug-v20-2]
    paths:
      - .github/workflows/ak-debug-v20-2-one-shot.yml

permissions:
  contents: write

jobs:
  audit-fix-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/ak-debug-v20-2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Apply root-cause fixes and AK-debug gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')
          BUILD_ID = 'v20.2-20260726'
          RELEASE = 'v20.2'
          PACKAGE_VERSION = '20.2.0'
          STATUS = 'ak-debug-full-audit-and-deploy-hardening'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8', newline='\n')

          def replace(path, old, new, required=True):
              text = read(path)
              if required and old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              write(path, text.replace(old, new))

          build_path = ROOT / 'BUILD.json'
          build = json.loads(build_path.read_text(encoding='utf-8'))
          build.update({
              'buildId': BUILD_ID,
              'release': RELEASE,
              'generatedAtUtc': '2026-07-26T09:20:00+00:00',
              'status': STATUS,
          })
          build['knownBlockers'] = [
              item.replace('v20.1', RELEASE).replace('v19.4', RELEASE)
              for item in build.get('knownBlockers', [])
          ]
          build_path.write_text(json.dumps(build, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          data_path = ROOT / 'tools/wedding-data.json'
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data['build'].update({
              'buildId': BUILD_ID,
              'release': RELEASE,
              'status': STATUS,
          })
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = ROOT / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = PACKAGE_VERSION
          test_cmd = package['scripts']['test']
          if 'tests/build_metadata_check.py' not in test_cmd:
              test_cmd = test_cmd.replace(
                  'python tests/consistency_check.py &&',
                  'python tests/consistency_check.py && python tests/build_metadata_check.py &&'
              )
          if 'tests/visual_safe_zone_browser.mjs' not in test_cmd:
              test_cmd += ' && node tests/visual_safe_zone_browser.mjs'
          package['scripts']['test'] = test_cmd
          package['scripts']['test:metadata'] = 'python tests/build_metadata_check.py'
          package['scripts']['test:visual-safe-zones'] = 'node tests/visual_safe_zone_browser.mjs'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock_path = ROOT / 'package-lock.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version'] = PACKAGE_VERSION
          lock['packages']['']['version'] = PACKAGE_VERSION
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Synchronize current build markers and release labels in source/tests.
          for path in [
              'index.html', 'config.js',
              'tests/consistency_check.py', 'tests/verify_release.py',
              'tests/verify_dist.py', 'tests/browser_smoke.mjs',
              'tests/share_entry_pages_check.py'
          ]:
              text = read(path)
              text = text.replace('v20.1-20260726', BUILD_ID)
              write(path, text)

          config = read('config.js')
          config = config.replace('CẤU HÌNH THIỆP CƯỚI ĐA SỰ KIỆN — v19', f'CẤU HÌNH THIỆP CƯỚI ĐA SỰ KIỆN — {RELEASE}')
          config = config.replace('release: "v20.1"', f'release: "{RELEASE}"')
          config = config.replace('status: "visual-safe-zones-and-cover-refinement"', f'status: "{STATUS}"')
          write('config.js', config)

          index = read('index.html')
          index = index.replace('styles.css?v=5.6', 'styles.css?v=5.7')
          index = index.replace('config.js?v=5.6', 'config.js?v=5.7')
          index = index.replace('app.js?v=5.6', 'app.js?v=5.7')
          index = index.replace(
              '          target="_blank"\n          rel="noopener noreferrer"\n',
              ''
          )
          index = index.replace('\n<div class="invitation-cover__content">', '\n      <div class="invitation-cover__content">')
          index = index.replace('          </button>\n</div>\n\n        <label class="invitation-cover__autoplay">', '          </button>\n        </div>\n\n        <label class="invitation-cover__autoplay">')
          write('index.html', index)

          app = read('app.js')
          app = app.replace('wedding-cover-opened-v19', 'wedding-cover-opened-v20-2')
          write('app.js', app)

          backend = read('tools/wedding-wishes-webapp.gs')
          backend = backend.replace('Quý vị', 'Quý khách')
          backend = backend.replace('(release v17)', f'(release {RELEASE})')
          write('tools/wedding-wishes-webapp.gs', backend)

          workflow_path = ROOT / '.github/workflows/verify-pages.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace('reports/RELEASE-READINESS-V19.4.json', 'reports/RELEASE-READINESS.json')
          workflow = workflow.replace('reports/RELEASE-READINESS-V19.4.md', 'reports/RELEASE-READINESS.md')
          workflow = workflow.replace(
              '          EXPECTED_BUILD: v19.4-20260724\n',
              ''
          )
          workflow = workflow.replace(
              '          python tools/verify_live_pages.py \\\n',
              '          EXPECTED_BUILD="$(python -c \'import json; print(json.load(open("BUILD.json", encoding="utf-8"))["buildId"])\')"\n          python tools/verify_live_pages.py \\\n'
          )
          workflow = workflow.replace(
              '          npm run test:browser 2>&1 | tee reports/browser-smoke-ci.log\n',
              '          npm run test:browser 2>&1 | tee reports/browser-smoke-ci.log\n          npm run test:visual-safe-zones\n'
          )
          visual_upload = '''      - name: Upload visual safe-zone evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wedding-visual-safe-zones
          path: reports/visual-safe-zone-*.png
          if-no-files-found: error
          retention-days: 7
'''
          marker = '      - name: Audio/story browser regression\n'
          if visual_upload not in workflow:
              workflow = workflow.replace(marker, visual_upload + marker)
          if 'python tests/build_metadata_check.py' not in workflow:
              workflow = workflow.replace(
                  '          python tests/consistency_check.py\n',
                  '          python tests/consistency_check.py\n          python tests/build_metadata_check.py\n'
              )
          workflow_path.write_text(workflow, encoding='utf-8', newline='\n')

          guest_workflow_path = ROOT / '.github/workflows/guest-release.yml'
          guest_workflow = guest_workflow_path.read_text(encoding='utf-8')
          if 'python tests/build_metadata_check.py' not in guest_workflow:
              guest_workflow = guest_workflow.replace(
                  '          python tests/consistency_check.py\n',
                  '          python tests/consistency_check.py\n          python tests/build_metadata_check.py\n'
              )
          if 'npm run test:visual-safe-zones' not in guest_workflow:
              guest_workflow = guest_workflow.replace(
                  '          npm run test:browser\n',
                  '          npm run test:browser\n          npm run test:visual-safe-zones\n'
              )
          guest_workflow_path.write_text(guest_workflow, encoding='utf-8', newline='\n')

          hardening = read('tests/release_hardening_check.mjs')
          hardening = hardening.replace('FAIL: v19.4 release hardening', f'FAIL: {RELEASE} release hardening')
          hardening = hardening.replace('PASS: v19.4 adaptive, contact and focus hardening', f'PASS: {RELEASE} adaptive, contact and focus hardening')
          write('tests/release_hardening_check.mjs', hardening)

          readme = read('README.md')
          readme = readme.replace('# Wedding Xuân & Phượng — v19 Multi-Event Journey', f'# Wedding Xuân & Phượng — {RELEASE} Multi-Event Journey')
          readme = re.sub(
              r'Build hiện tại: \*\*[^*]+\*\*[^\n]*',
              f'Build hiện tại: **{BUILD_ID}** — AK-DEBUG Full Audit & Deploy Hardening.',
              readme,
              count=1
          )
          readme = readme.replace('## Nâng cấp v19.4', f'## Nâng cấp {RELEASE}')
          readme = readme.replace('## Trải nghiệm mở thiệp v19.2', '## Trải nghiệm mở thiệp')
          readme = readme.replace('## Hardening v19.4', f'## Hardening {RELEASE}')
          readme = readme.replace(
              'python tests/consistency_check.py\n',
              'python tests/consistency_check.py\npython tests/build_metadata_check.py\n'
          )
          readme = readme.replace(
              'npm run test:browser\n',
              'npm run test:browser\nnpm run test:visual-safe-zones\n'
          )
          write('README.md', readme)

          metadata_test = f'''from pathlib import Path
import json
import sys

ROOT = Path(__file__).resolve().parents[1]
EXPECTED_BUILD = "{BUILD_ID}"
EXPECTED_RELEASE = "{RELEASE}"
EXPECTED_PACKAGE = "{PACKAGE_VERSION}"
errors = []

def require(value, message):
    if not value:
        errors.append(message)

build = json.loads((ROOT / "BUILD.json").read_text(encoding="utf-8"))
data = json.loads((ROOT / "tools/wedding-data.json").read_text(encoding="utf-8"))
package = json.loads((ROOT / "package.json").read_text(encoding="utf-8"))
lock = json.loads((ROOT / "package-lock.json").read_text(encoding="utf-8"))
index = (ROOT / "index.html").read_text(encoding="utf-8")
config = (ROOT / "config.js").read_text(encoding="utf-8")
app = (ROOT / "app.js").read_text(encoding="utf-8")
backend = (ROOT / "tools/wedding-wishes-webapp.gs").read_text(encoding="utf-8")
readme = (ROOT / "README.md").read_text(encoding="utf-8")
verify_pages = (ROOT / ".github/workflows/verify-pages.yml").read_text(encoding="utf-8")

require(build["buildId"] == EXPECTED_BUILD, "BUILD.json sai build")
require(build["release"] == EXPECTED_RELEASE, "BUILD.json sai release")
require(data["build"]["buildId"] == EXPECTED_BUILD, "wedding-data sai build")
require(package["version"] == EXPECTED_PACKAGE, "package.json sai version")
require(lock["version"] == EXPECTED_PACKAGE, "package-lock root sai version")
require(lock["packages"][""]["version"] == EXPECTED_PACKAGE, "package-lock package sai version")
require(EXPECTED_BUILD in index and EXPECTED_BUILD in config, "runtime thiếu build marker")
require(EXPECTED_BUILD in readme, "README sai build")
require("v19.4-20260724" not in verify_pages, "workflow deploy còn hard-code v19.4")
require("json.load(open(\"BUILD.json\"" in verify_pages, "workflow deploy chưa đọc build động")
require("Quý vị" not in backend, "backend còn wording Quý vị")
require("wedding-cover-opened-v20-2" in app, "session key cover chưa version hóa")
require('id="rsvpButton"' in index, "thiếu nút RSVP")
rsvp_fragment = index[index.index('id="rsvpButton"') - 160:index.index('id="rsvpButton"') + 220]
require('target="_blank"' not in rsvp_fragment, "tel RSVP không được mở tab trắng")
require('id="coverSimpleButton"' not in index, "nút simple mode quay lại DOM")
require('class="invitation-cover__seam"' not in index, "đường seam quay lại DOM")

if errors:
    print("FAIL")
    for error in errors:
        print("-", error)
    sys.exit(1)
print("PASS: v20.2 build metadata, deploy contract and wording consistency")
'''
          write('tests/build_metadata_check.py', metadata_test)

          visual_test = r'''import http from "node:http";
import fs from "node:fs";
import path from "node:path";
import { fileURLToPath } from "node:url";
import { chromium } from "playwright";

const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
const contentTypes = {
  ".html": "text/html; charset=utf-8", ".js": "application/javascript; charset=utf-8",
  ".css": "text/css; charset=utf-8", ".json": "application/json; charset=utf-8",
  ".png": "image/png", ".jpg": "image/jpeg", ".jpeg": "image/jpeg",
  ".webp": "image/webp", ".svg": "image/svg+xml", ".mp3": "audio/mpeg",
  ".ics": "text/calendar; charset=utf-8"
};
function assert(condition, message) { if (!condition) throw new Error(message); }
function createServer() {
  return http.createServer((request, response) => {
    const pathname = decodeURIComponent(new URL(request.url, "http://127.0.0.1").pathname);
    const relative = pathname === "/" ? "index.html" : pathname.slice(1);
    const resolved = path.resolve(root, relative);
    if (!resolved.startsWith(root) || !fs.existsSync(resolved)) {
      response.writeHead(404); response.end("Not found"); return;
    }
    const stat = fs.statSync(resolved);
    const file = stat.isDirectory() ? path.join(resolved, "index.html") : resolved;
    response.writeHead(200, { "Content-Type": contentTypes[path.extname(file).toLowerCase()] || "application/octet-stream", "Cache-Control": "no-store" });
    fs.createReadStream(file).pipe(response);
  });
}

fs.mkdirSync(path.join(root, "reports"), { recursive: true });
const viewports = [
  { width: 320, height: 568 },
  { width: 390, height: 844 },
  { width: 430, height: 932 },
  { width: 1440, height: 900 },
  { width: 568, height: 320 }
];
const server = createServer();
await new Promise((resolve) => server.listen(0, "127.0.0.1", resolve));
const baseUrl = `http://127.0.0.1:${server.address().port}/`;
const browser = await chromium.launch();
const evidence = [];
try {
  for (const viewport of viewports) {
    const page = await browser.newPage({ viewport });
    await page.addInitScript(() => { window.__WEDDING_TEST_MODE__ = true; });
    await page.route(/https:\/\/fonts\.googleapis\.com\/.*/, (route) => route.fulfill({ status: 200, contentType: "text/css", body: "" }));
    await page.route(/https:\/\/fonts\.gstatic\.com\/.*/, (route) => route.fulfill({ status: 204, body: "" }));
    const pageErrors = [];
    page.on("pageerror", (error) => pageErrors.push(String(error)));
    await page.goto(baseUrl, { waitUntil: "domcontentloaded" });
    await page.waitForSelector("#invitationCover[open]");

    const cover = await page.evaluate(() => {
      const dialog = document.querySelector("#invitationCover");
      const content = document.querySelector(".invitation-cover__content").getBoundingClientRect();
      const seal = document.querySelector("#coverOpenButton").getBoundingClientRect();
      return {
        simpleButton: Boolean(document.querySelector("#coverSimpleButton")),
        seam: Boolean(document.querySelector(".invitation-cover__seam")),
        contentTop: content.top, contentBottom: content.bottom,
        sealWidth: seal.width, sealHeight: seal.height,
        scrollWidth: document.documentElement.scrollWidth,
        clientWidth: document.documentElement.clientWidth,
        dialogOpen: dialog.open
      };
    });
    assert(cover.dialogOpen, `Cover chưa mở ${viewport.width}x${viewport.height}`);
    assert(!cover.simpleButton, "Nút Xem thiệp đơn giản xuất hiện lại");
    assert(!cover.seam, "Đường seam xuất hiện lại");
    assert(cover.contentTop >= -1 && cover.contentBottom <= viewport.height + 1, `Nội dung cover bị cắt: ${JSON.stringify({viewport, cover})}`);
    assert(cover.sealWidth >= 44 && cover.sealHeight >= 44, "Con dấu nhỏ hơn vùng chạm an toàn");
    assert(cover.scrollWidth <= cover.clientWidth + 1, "Cover có horizontal overflow");

    await page.locator("#coverOpenButton").click();
    await page.waitForFunction(() => document.body.classList.contains("invitation-opened"));
    const hero = await page.evaluate(() => {
      const section = document.querySelector(".hero").getBoundingClientRect();
      const names = document.querySelector(".hero-names").getBoundingClientRect();
      const date = document.querySelector(".hero__date").getBoundingClientRect();
      const open = document.querySelector("#openInvitationButton").getBoundingClientRect();
      return {
        sectionTop: section.top, sectionHeight: section.height,
        namesTop: names.top, namesBottom: names.bottom,
        dateTop: date.top, dateBottom: date.bottom,
        openTop: open.top,
        scrollWidth: document.documentElement.scrollWidth,
        clientWidth: document.documentElement.clientWidth
      };
    });
    assert(hero.namesTop >= hero.sectionTop - 1, "Tên hero vượt khỏi section");
    assert(hero.namesBottom <= hero.sectionTop + hero.sectionHeight * 0.43, `Tên hero rơi khỏi vùng ảnh an toàn: ${JSON.stringify({viewport, hero})}`);
    assert(hero.namesBottom < hero.dateTop, "Tên hero đè lên ngày");
    assert(hero.dateBottom < hero.openTop, "Ngày hero đè lên nút lời mời");
    assert(hero.scrollWidth <= hero.clientWidth + 1, "Trang có horizontal overflow sau mở thiệp");

    await page.locator(".closing").scrollIntoViewIfNeeded();
    const closing = await page.evaluate(() => {
      const section = document.querySelector(".closing").getBoundingClientRect();
      const content = document.querySelector(".closing__content").getBoundingClientRect();
      return {
        sectionTop: section.top, sectionHeight: section.height,
        contentTop: content.top, contentBottom: content.bottom
      };
    });
    assert(closing.contentTop >= closing.sectionTop - 1, "Closing content vượt khỏi ảnh");
    assert(closing.contentBottom <= closing.sectionTop + closing.sectionHeight * 0.38, `Thank-you rơi vào vùng mặt trung tâm: ${JSON.stringify({viewport, closing})}`);

    const screenshotPath = path.join(root, "reports", `visual-safe-zone-${viewport.width}x${viewport.height}.png`);
    await page.screenshot({ path: screenshotPath, fullPage: true });
    assert(pageErrors.length === 0, `Page errors: ${pageErrors.join(" | ")}`);
    evidence.push({ viewport, cover, hero, closing, screenshotPath: path.relative(root, screenshotPath) });
    await page.close();
  }
  console.log(JSON.stringify({ verdict: "PASS", evidence }, null, 2));
} finally {
  await browser.close();
  await new Promise((resolve) => server.close(resolve));
}
'''
          write('tests/visual_safe_zone_browser.mjs', visual_test)

          report = f'''# AK-DEBUG Full Audit — Wedding Xuân & Phượng {RELEASE}

Generated: 2026-07-26 09:20 UTC  
Target: `xuan2261/wedding-xuan-phuong` / `main` at `2ad2e61`  
Method: reproduce → static/data audit → security/privacy audit → fresh multi-viewport render → root-cause fix → full CI → evidence judge.

## Verdict before fix

`FAIL_DEPLOY_CONTRACT_WITH_RUNTIME_TECHNICAL_PASS`

The v20.1 source and pull-request gates passed, but the production deploy workflow still verified the old build `v19.4-20260724`. Therefore PR success did not prove that the v20.1 merge could complete the post-deploy live verification.

## Root causes fixed

| Severity | Finding | Root cause | Resolution |
|---|---|---|---|
| P0 | Main deploy verification pinned to v19.4 | build ID duplicated in workflow | Read `BUILD.json` dynamically during live verification |
| P1 | README/package/config comments remained v19.x | release metadata updated incompletely | Synchronize to {BUILD_ID} / package {PACKAGE_VERSION} |
| P1 | Apps Script still returned “Quý vị” | backend copy was outside the previous replacement scope | Normalize backend copy to “Quý khách” |
| P2 | RSVP `tel:` fallback had `target=_blank` | HTML inherited web-link attributes | Remove blank-tab behavior |
| P2 | Cover session key named v19 | legacy cache namespace | Version key as `wedding-cover-opened-v20-2` |
| P1 | Visual overlap could regress without rendered evidence | prior checks mostly structural | Add fresh 320/390/430/568-landscape/1440 Playwright safe-zone screenshots and geometry gates |

## Remaining release blockers — intentionally not fabricated

- Multi-event Google Form URLs and RSVP entry IDs are not configured.
- Nha Trang and Sài Gòn venue addresses/maps are incomplete.
- Bride-side map pin remains unverified.
- RSVP deadlines, event end times and final guest grouping are incomplete.
- Physical Android, iPhone Safari, Zalo and Messenger testing remains required.
- Bank account and QR data are shipped in public static `config.js`; hiding the button is not access control. This is acceptable only if the couple explicitly accepts public discoverability.
- The public Apps Script endpoint is moderation-safe for display, but `clientKey`, `openedAt` and `siteOrigin` are client supplied; they reduce casual spam but are not strong authentication or abuse prevention.

## New gates

- Build/package/workflow metadata consistency.
- No stale v19.4 production deploy marker.
- No “Quý vị” in wishes backend.
- No blank tab on `tel:` RSVP.
- No visible simple-mode button or seam.
- Multi-viewport hero and closing safe-zone geometry.
- Screenshot artifacts for visual review.

## Release decision

`SOURCE_READY_AFTER_CI; GUEST_READY_BLOCKED_BY_REAL_DATA_AND_PHYSICAL_E2E`
'''
          write('reports/AK-DEBUG-FULL-AUDIT-V20.2.md', report)
