name: Materialize Photoshop image pack v20

on:
  push:
    branches: [images/refresh-photoshop-v20]
    paths:
      - .image-pack-v20/READY

permissions:
  contents: write

concurrency:
  group: materialize-image-pack-v20
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: images/refresh-photoshop-v20
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Materialize responsive wedding images
        run: python tools/materialize_image_pack_v20.py
      - name: Verify generated image dimensions and source syntax
        run: |
          python tests/verify_assets.py
          node --check app.js
          node --check config.js
      - name: Commit generated assets and remove staging payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(images): refresh all wedding photos from Photoshop masters"
          git push origin HEAD:images/refresh-photoshop-v20
