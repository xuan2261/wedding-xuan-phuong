name: Materialize Photoshop image pack v20

on:
  push:
    branches: [images/refresh-photoshop-v20]
    paths:
      - .image-pack-v20/READY
  pull_request:
    branches: [main]
    paths:
      - .image-pack-v20/READY
      - .github/workflows/materialize-image-pack-v20.yml
      - tools/materialize_image_pack_v20.py

permissions:
  contents: write

concurrency:
  group: materialize-image-pack-v20
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: images/refresh-photoshop-v20
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Materialize responsive wedding images
        id: materialize
        shell: bash
        run: |
          mkdir -p reports
          set +e
          python tools/materialize_image_pack_v20.py > reports/materialize-image-pack-v20.log 2>&1
          status=$?
          cat reports/materialize-image-pack-v20.log
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Commit diagnostic log when materialization fails
        if: steps.materialize.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/materialize-image-pack-v20.log
          git commit -m "debug(images): capture v20 materialization failure"
          git push origin HEAD:images/refresh-photoshop-v20
      - name: Fail after preserving diagnostics
        if: steps.materialize.outputs.status != '0'
        run: exit 1
      - name: Verify generated image dimensions and source syntax
        run: |
          python tests/verify_assets.py
          node --check app.js
          node --check config.js
      - name: Commit generated assets and remove staging payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(images): refresh all wedding photos from Photoshop masters"
          git push origin HEAD:images/refresh-photoshop-v20
