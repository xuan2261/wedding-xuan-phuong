name: Verify and deploy wedding site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install verification dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow opencv-python-headless
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify source
        run: |
          python tests/consistency_check.py
          python tests/build_metadata_check.py
          python tests/verify_release.py
          node tests/multi_event_check.mjs
          node tests/opening_experience_check.mjs
          node tests/audio_story_regression_check.mjs
          node tests/rsvp_form_check.mjs
          node tests/release_hardening_check.mjs
          python tests/guest_tool_check.py
          python tests/release_readiness_check.py
          python tests/live_pages_verifier_check.py
          node tests/lifecycle_check.js
          node tests/contract_check.js
          node tests/personalization_check.js
          python tests/verify_assets.py
          node --check app.js
          node --check config.js
          node --check guest-utils.js
          node --check event-entry.js
          for file in tools/*.gs; do cp "$file" /tmp/apps-script-check.js; node --check /tmp/apps-script-check.js; done
      - name: Generate release-readiness evidence
        run: |
          python tools/release_readiness.py \
            --json reports/RELEASE-READINESS.json \
            --markdown reports/RELEASE-READINESS.md
      - name: Upload release-readiness report
        uses: actions/upload-artifact@v7
        with:
          name: wedding-release-readiness
          path: |
            reports/RELEASE-READINESS.json
            reports/RELEASE-READINESS.md
          if-no-files-found: error
      - name: Build and verify clean dist
        run: |
          python tools/build-dist.py
          python tests/share_entry_pages_check.py
          python tests/verify_dist.py
      - name: Browser smoke and visual safe zones
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee reports/browser-smoke-ci.log
          npm run test:visual-safe-zones
      - name: Upload browser smoke log
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wedding-browser-smoke-log
          path: reports/browser-smoke-ci.log
          if-no-files-found: error
          retention-days: 1
      - name: Upload visual safe-zone evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wedding-visual-safe-zones
          path: reports/visual-safe-zone-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Audio/story browser regression
        run: |
          set -o pipefail
          npm run test:audio-story-browser 2>&1 | tee reports/audio-story-browser-ci.log
      - name: Upload audio/story browser log
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wedding-audio-story-browser-log
          path: reports/audio-story-browser-ci.log
          if-no-files-found: error
          retention-days: 1
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v7
      - name: Verify live build and event entry pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p reports
          EXPECTED_BUILD="$(python -c 'import json; print(json.load(open("BUILD.json", encoding="utf-8"))["buildId"])')"
          python tools/verify_live_pages.py \
            --base-url "${PAGE_URL}" \
            --expected-build "${EXPECTED_BUILD}" \
            --attempts 18 \
            --delay-seconds 10 \
            --report reports/LIVE-PAGES-DEPLOY.json
      - name: Upload deployment verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wedding-live-deploy-${{ github.run_id }}
          path: reports/LIVE-PAGES-DEPLOY.json
          if-no-files-found: error
          retention-days: 14
