name: Verify and deploy wedding site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install verification dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow opencv-python-headless
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # Danh sách kiểm tra nằm ở package.json để workflow và máy cá nhân dùng
      # chung một đường. test:static bao gồm cả bước dựng và kiểm tra dist.
      - name: Verify source and build dist
        run: npm run test:static
      - name: Generate release-readiness evidence
        run: |
          python tools/release_readiness.py \
            --json reports/RELEASE-READINESS.json \
            --markdown reports/RELEASE-READINESS.md
      - name: Upload release-readiness report
        uses: actions/upload-artifact@v7
        with:
          name: wedding-release-readiness
          path: |
            reports/RELEASE-READINESS.json
            reports/RELEASE-READINESS.md
          if-no-files-found: error
      # Chạy đúng một lệnh canonical trong package.json để mọi browser gate,
      # gồm map binding đủ bốn event, không thể bị bỏ quên trong workflow PR.
      - name: Full browser regression
        run: |
          set -o pipefail
          npm run test:browser-all 2>&1 | tee reports/browser-all-ci.log
      - name: Upload browser regression log
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wedding-browser-regression-log
          path: reports/browser-all-ci.log
          if-no-files-found: error
          retention-days: 1
      - name: Upload visual safe-zone evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wedding-visual-safe-zones
          path: reports/visual-safe-zone-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
      - name: Verify live build and event entry pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p reports
          EXPECTED_BUILD="$(python -c 'import json; print(json.load(open("BUILD.json", encoding="utf-8"))["buildId"])')"
          python tools/verify_live_pages.py \
            --base-url "${PAGE_URL}" \
            --expected-build "${EXPECTED_BUILD}" \
            --attempts 18 \
            --delay-seconds 10 \
            --report reports/LIVE-PAGES-DEPLOY.json
      - name: Upload deployment verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wedding-live-deploy-${{ github.run_id }}
          path: reports/LIVE-PAGES-DEPLOY.json
          if-no-files-found: error
          retention-days: 14
