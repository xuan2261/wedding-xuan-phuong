name: Certify guest release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-release-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install verification dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow opencv-python-headless
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm install --no-save --no-package-lock @lhci/cli@0.15.x
      - name: Enforce strict guest readiness
        run: |
          mkdir -p reports
          python tools/release_readiness.py \
            --strict \
            --json reports/GUEST-RELEASE-READINESS.json \
            --markdown reports/GUEST-RELEASE-READINESS.md
      # Cùng danh sách với verify-pages.yml, khai báo một lần ở package.json.
      - name: Verify source and build
        run: npm run test:static
      - name: Browser regression
        run: npm run test:browser-all
      - name: Lighthouse budgets
        run: |
          npx lhci collect --config=./lighthouserc.cjs
          npx lhci assert --config=./lighthouserc.cjs
      - name: Upload guest-release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wedding-guest-release-evidence
          path: |
            reports/GUEST-RELEASE-READINESS.json
            reports/GUEST-RELEASE-READINESS.md
            reports/visual-safe-zone-*.png
            .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
