name: Diagnose staged image pack v20

on:
  push:
    branches: [images/refresh-photoshop-v20]
    paths:
      - tools/diagnose_image_pack_v20.py
      - .github/workflows/diagnose-image-pack-v20.yml
      - .image-pack-v20/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: images/refresh-photoshop-v20
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Diagnose staged payload
        run: python tools/diagnose_image_pack_v20.py
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/image-pack-v20-diagnostic.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
            exit 0
          fi
          git commit -m "debug(images): record staged pack diagnostics"
          git push origin HEAD:images/refresh-photoshop-v20
