name: Apply event map fix v20.3

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/event-map-binding-v20-2'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source and data fixes
        run: |
          python tools/apply-event-map-fix-v20-3.py
          python tools/finalize-event-map-fix-v20-3.py
          python tools/generate-multi-event-calendars.py
          python tools/build-dist.py

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run full test suite and preserve evidence
        id: tests
        shell: bash
        run: |
          set +e
          mkdir -p reports
          npm test 2>&1 | tee reports/V20.3-TEST.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit patched source and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(maps): apply v20.3 patch and capture test evidence"
          git push origin HEAD:${{ github.head_ref }}

      - name: Enforce test result
        if: steps.tests.outputs.exit_code != '0'
        run: |
          echo "Full test suite failed; inspect reports/V20.3-TEST.log"
          exit 1
