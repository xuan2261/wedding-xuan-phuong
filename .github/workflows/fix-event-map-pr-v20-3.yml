name: Verify event map fix v20.3

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  verify-fix:
    if: github.head_ref == 'fix/event-map-binding-v20-2'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --disable-pip-version-check Pillow opencv-python-headless
          npm ci
          npx playwright install --with-deps chromium

      - name: Run full test suite and preserve tail
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/v20-3-test.log
          code=${PIPESTATUS[0]}
          mkdir -p reports
          tail -n 360 /tmp/v20-3-test.log > reports/V20.3-TEST-CURRENT.log
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit test evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/V20.3-TEST-CURRENT.log
          git commit -m "test(ci): record v20.3 full-suite evidence"
          git push origin HEAD:${{ github.head_ref }}

      - name: Enforce test result
        if: steps.tests.outputs.exit_code != '0'
        run: |
          echo "Full test suite failed; inspect reports/V20.3-TEST-CURRENT.log"
          exit 1
